<div   class="card bg-base-100 shadow-xl mx-auto pt-10 mt-10 ">
  <h3 class=" text-3xl text-red-500">
    {{ title() }}
  </h3>

  <ul class="list">
    @for(member of members();track member.id) {

      <li class="list-row items-center" >
        <img  src="/user.png" class="size-12 rounded-box"  />
        <div>
          {{ member.dispalyName }}
        </div>

      </li>
    }

  </ul>
</div>
