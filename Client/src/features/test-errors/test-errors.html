<div class="flex justify-center gap-3 pt-10">
    <button class="btn btn-neutral" (click)="get500Error()" >Test500Error</button>
    <button class="btn btn-info" (click)="get400Error()" >Test 400 Error</button>
    <button class="btn btn-secondary" (click)="get400ValidationError()" >Test Validation Error</button>
    <button class="btn btn-success" (click)="get404Error()" >Test 404 Error</button>

</div>


@if(validationError().length> 0 ){
    <div class="card bg-base-100 flex mt-5 rounded-2xl w-1/2 px-3 mx-auto">
        <ul class="flex flex-col text-red-600 space-y-2">
            @for (error of validationError(); track $index) {
                <li>{{error}}</li>
            }

        </ul>

    </div>
}
