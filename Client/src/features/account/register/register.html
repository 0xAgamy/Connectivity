<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary ">Sign Up</div>

  <div class="card-body w-full ">

    <form #registerFrom="ngForm" (ngSubmit)="register()" class="flex flex-col gap-4 w-full"  >

        <input [(ngModel)]="creds.displayName" class="input w-full" type="text" name="name"  placeholder="Username" >
        <input [(ngModel)]="creds.email" class="input w-full" type="text" name="email"  placeholder="Email" >
        <input [(ngModel)]="creds.password" class="input w-full" type="password" name="password"  placeholder="Password" >

        
  


        <div class="flex items-center justify-end gap-3">
            <button type="button" (click)="cancel()" class="btn ">Cancel</button>
            <button type="submit" class="btn btn-primary">Register</button>



            
            


        </div>








    </form>
  </div>

    











</div>
